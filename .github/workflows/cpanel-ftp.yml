name: Deploy to cPanel (FTPS)

# Fully automatic cPanel deploy: on every push to main, sync the site to the
# host over FTPS. Dormant until you set the repo variable DEPLOY_FTP=true and
# add the FTP_* secrets (see below), so it never runs half-configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    if: vars.DEPLOY_FTP == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync to public_html over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The FTP account's home should be public_html, so "/" maps there.
          local-dir: ./
          server-dir: ./
          # Never ship repo plumbing or clobber host validation/cgi files.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            DEPLOY.md
            .nojekyll
            **/.well-known/**
            **/cgi-bin/**
